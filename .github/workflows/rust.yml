name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  verify:

    runs-on: ubuntu-latest

    env:
      # Must match the `vstd` version pinned in Cargo.toml.
      VERUS_RELEASE: 0.2026.09.20.aef82ed
      # The Rust toolchain this Verus release is built against.
      VERUS_TOOLCHAIN: 1.98.1

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain for Verus
      run: rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal
    - name: Install Verus
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "release/$VERUS_RELEASE" -R verus-lang/verus \
          -p "verus-$VERUS_RELEASE-x86-linux.zip" -D "$RUNNER_TEMP"
        unzip -q "$RUNNER_TEMP/verus-$VERUS_RELEASE-x86-linux.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/verus-x86-linux" >> "$GITHUB_PATH"
    - name: Verify
      run: cargo verus verify
